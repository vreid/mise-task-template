{
  "rules":
    [
      {
        "id": "poc.python.input-to-sql",
        "languages": ["python"],
        "mode": "taint",
        "severity": "HIGH",
        "message":
          "Untrusted input reaches SQL injection sensitive API (CWE-89). Use a
          constant statement and bound parameters.",
        "metadata":
          {
            "category": "security",
            "confidence": "HIGH",
            "cwe": ["CWE-89: SQL injection"],
            "owasp": ["A05:2025"],
          },
        "pattern-sources":
          [
            {
              "pattern-either":
                [
                  { "pattern": "os.getenv(...)" },
                  { "pattern": "os.environ[$KEY]" },
                  { "pattern": "os.environ.get(...)" },
                  { "pattern": "sys.argv" },
                  { "pattern": "request.args.get(...)" },
                  { "pattern": "request.form.get(...)" },
                  { "pattern": "request.GET.get(...)" },
                ],
            },
          ],
        "pattern-sinks":
          [
            {
              "patterns":
                [
                  {
                    "pattern-either":
                      [
                        { "pattern": "$DB.execute($INPUT, ...)" },
                        { "pattern": "$DB.executemany($INPUT, ...)" },
                        { "pattern": "$DB.executescript($INPUT, ...)" },
                      ],
                  },
                  { "focus-metavariable": "$INPUT" },
                ],
            },
          ],
      },
