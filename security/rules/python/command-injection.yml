rules:
  - id: poc.python.input-to-shell
    languages: [python]
    mode: taint
    severity: ERROR
    message: >-
      Environment or command-line input reaches a shell command (CWE-78). Use
      subprocess.run with a fixed executable, an argument list, and shell=False
      instead.
    metadata:
      category: security
      confidence: HIGH
      impact: HIGH
      cwe: ["CWE-78: OS Command Injection"]
      owasp: ["A05:2025 - Injection"]
    pattern-sources:
      - pattern-either:
          - pattern: os.getenv(...)
          - pattern: os.environ[$KEY]
          - pattern: os.environ.get(...)
          - pattern: sys.argv
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.system($COMMAND)
              - pattern: os.popen($COMMAND, ...)
              - pattern: subprocess.$FUNCTION($COMMAND, ..., shell=True, ...)
          - focus-metavariable: $COMMAND
