rules:
  - id: poc.rust.environment-to-shell
    languages: [rust]
    mode: taint
    severity: ERROR
    message: >-
      Environment input reaches a shell command (CWE-78). Use Command with a
      fixed executable and separate arguments instead of sh -c.
    metadata:
      category: security
      confidence: HIGH
      impact: HIGH
      cwe: ["CWE-78: OS Command Injection"]
      owasp: ["A05:2025 - Injection"]
    pattern-sources:
      - pattern: std::env::var(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: std::process::Command::new("/bin/sh").arg("-c").arg($COMMAND)
              - pattern: std::process::Command::new("sh").arg("-c").arg($COMMAND)
          - focus-metavariable: $COMMAND
