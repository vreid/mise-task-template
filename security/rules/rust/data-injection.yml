{
  "rules":
    [
      {
        "id": "poc.rust.input-to-sql",
        "languages": ["rust"],
        "mode": "taint",
        "severity": "HIGH",
        "message":
          "Untrusted input reaches SQL injection sensitive API (CWE-89). Use a
          constant statement and bound parameters.",
        "metadata":
          {
            "category": "security",
            "confidence": "HIGH",
            "cwe": ["CWE-89: SQL injection"],
            "owasp": ["A05:2025"],
          },
        "pattern-sources":
          [
            {
              "pattern-either":
                [
                  { "pattern": "std::env::var(...)" },
                  { "pattern": "std::env::args()" },
                ],
            },
          ],
        "pattern-sinks":
          [
            {
              "patterns":
                [
                  {
                    "pattern-either":
                      [
                        { "pattern": "sqlx::query($INPUT)" },
                        {
                          "pattern":
                            "rusqlite::Connection::execute($DB, $INPUT, ...)",
                        },
                      ],
                  },
                  { "focus-metavariable": "$INPUT" },
                ],
            },
          ],
      },
      {
        "id": "poc.rust.input-to-path",
        "languages": ["rust"],
        "mode": "taint",
        "severity": "HIGH",
        "message":
          "Untrusted input reaches Path traversal sensitive API (CWE-22).
          Resolve a trusted identifier through an allowlist; do not open an
          arbitrary input path.",
        "metadata":
          {
            "category": "security",
            "confidence": "HIGH",
            "cwe": ["CWE-22: Path traversal"],
            "owasp": ["A01:2025"],
          },
        "pattern-sources":
          [
            {
              "pattern-either":
                [
                  { "pattern": "std::env::var(...)" },
                  { "pattern": "std::env::args()" },
                ],
            },
          ],
        "pattern-sinks":
          [
            {
              "patterns":
                [
                  {
                    "pattern-either":
                      [
                        { "pattern": "std::fs::read_to_string($INPUT)" },
                        { "pattern": "std::fs::read($INPUT)" },
                      ],
                  },
                  { "focus-metavariable": "$INPUT" },
                ],
            },
          ],
      },
      {
        "id": "poc.rust.input-to-ssrf",
        "languages": ["rust"],
        "mode": "taint",
        "severity": "HIGH",
        "message":
          "Untrusted input reaches Server-side request forgery sensitive API
          (CWE-918). Allowlist destination schemes, hosts, and ports before
          issuing a request.",
        "metadata":
          {
            "category": "security",
            "confidence": "HIGH",
            "cwe": ["CWE-918: Server-side request forgery"],
            "owasp": ["A01:2025"],
          },
        "pattern-sources":
          [
            {
              "pattern-either":
                [
                  { "pattern": "std::env::var(...)" },
                  { "pattern": "std::env::args()" },
                ],
            },
          ],
        "pattern-sinks":
          [
            {
              "patterns":
                [
                  { "pattern-either": [{ "pattern": "reqwest::get($INPUT)" }] },
                  { "focus-metavariable": "$INPUT" },
                ],
            },
          ],
      },
      {
        "id": "poc.rust.input-to-html",
        "languages": ["rust"],
        "mode": "taint",
        "severity": "HIGH",
        "message":
          "Untrusted input reaches Cross-site scripting sensitive API (CWE-79).
          Use the framework HTML escaping facility or textContent instead of raw
          HTML.",
        "metadata":
          {
            "category": "security",
            "confidence": "HIGH",
            "cwe": ["CWE-79: Cross-site scripting"],
            "owasp": ["A05:2025"],
          },
        "pattern-sources":
          [
            {
              "pattern-either":
                [
                  { "pattern": "std::env::var(...)" },
                  { "pattern": "std::env::args()" },
                ],
            },
          ],
        "pattern-sinks":
          [
            {
              "patterns":
                [
                  {
                    "pattern-either":
                      [{ "pattern": "maud::PreEscaped($INPUT)" }],
                  },
                  { "focus-metavariable": "$INPUT" },
                ],
            },
          ],
      },
    ],
}
