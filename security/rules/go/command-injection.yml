rules:
  - id: poc.go.environment-to-shell
    languages: [go]
    mode: taint
    severity: ERROR
    message: >-
      Environment input reaches a shell command (CWE-78). Use exec.Command with
      a fixed executable and separate arguments instead of sh -c.
    metadata:
      category: security
      confidence: HIGH
      impact: HIGH
      cwe: ["CWE-78: OS Command Injection"]
      owasp: ["A05:2025 - Injection"]
    pattern-sources:
      - pattern: os.Getenv(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec.Command("/bin/sh", "-c", $COMMAND, ...)
              - pattern: exec.Command("sh", "-c", $COMMAND, ...)
          - focus-metavariable: $COMMAND
