{
  "rules":
    [
      {
        "id": "poc.csharp.input-to-sql",
        "languages": ["csharp"],
        "mode": "taint",
        "severity": "HIGH",
        "message":
          "Untrusted input reaches SQL injection sensitive API (CWE-89). Use a
          constant statement and bound parameters.",
        "metadata":
          {
            "category": "security",
            "confidence": "HIGH",
            "cwe": ["CWE-89: SQL injection"],
            "owasp": ["A05:2025"],
          },
        "pattern-sources":
          [
            {
              "pattern-either":
                [
                  {
                    "pattern": "System.Environment.GetEnvironmentVariable(...)",
                  },
                  { "pattern": "System.Environment.GetCommandLineArgs()" },
                  { "pattern": "args" },
                  { "pattern": "$REQUEST.Query[$KEY]" },
                  { "pattern": "$REQUEST.Form[$KEY]" },
                ],
            },
          ],
        "pattern-sinks":
          [
            {
              "patterns":
                [
                  {
                    "pattern-either":
                      [
                        {
                          "pattern":
                            "new System.Data.SqlClient.SqlCommand($INPUT, ...)",
                        },
                        {
                          "pattern":
                            "new Microsoft.Data.SqlClient.SqlCommand($INPUT,
                            ...)",
                        },
                        { "pattern": "$DB.Query($INPUT, ...)" },
                        { "pattern": "$COMMAND.CommandText = $INPUT" },
                      ],
                  },
                  { "focus-metavariable": "$INPUT" },
                ],
            },
          ],
      },
      {
