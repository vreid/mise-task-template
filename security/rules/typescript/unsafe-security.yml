{ "rules": [
      {
        "id": "poc.typescript.weak-hash",
        "languages": ["typescript"],
        "severity": "HIGH",
        "message":
          "Use a modern cryptographic hash; record a narrow exception for
          non-security compatibility.",
        "metadata":
          {
            "category": "security",
            "confidence": "HIGH",
            "cwe": ["CWE-327"],
            "owasp": ["A04:2025"],
          },
        # Default and awaited dynamic imports do not resolve; they are matched
        # through their import statements.
        "patterns":
          [
            {
              "pattern-either":
                [
                  {
                    "patterns":
                      [
                        { "pattern": "$MODULE.createHash($ALGORITHM, ...)" },
                        {
                          "metavariable-regex":
                            {
                              "metavariable": "$MODULE",
                              "regex": "^(?:node:)?crypto$",
                            },
                        },
                      ],
                  },
                  {
                    "patterns":
                      [
                        {
                          "pattern-either":
                            [
                              {
                                "pattern-inside":
                                  "import $LIBRARY from \"$MODULE\";\n...\n",
                              },
                              {
                                "pattern-inside":
                                  "$LIBRARY = await import(\"$MODULE\");\n...\n",
                              },
                            ],
                        },
                        { "pattern": "$LIBRARY.createHash($ALGORITHM, ...)" },
                        {
                          "metavariable-regex":
                            {
                              "metavariable": "$MODULE",
                              "regex": "^(?:node:)?crypto$",
                            },
                        },
                      ],
                  },
                  {
                    "patterns":
                      [
                        {
                          "pattern-inside":
                            "const {..., createHash, ...} = await
                            import(\"$MODULE\");\n...\n",
                        },
                        { "pattern": "createHash($ALGORITHM, ...)" },
                        {
                          "metavariable-regex":
                            {
                              "metavariable": "$MODULE",
                              "regex": "^(?:node:)?crypto$",
                            },
                        },
                      ],
                  },
                ],
            },
            {
              "metavariable-regex":
                {
                  "metavariable": "$ALGORITHM",
                  "regex": '^(?i)["''`](?:rsa-)?(?:md4|md5|sha-?1)["''`]$',
                },
            },
          ],
      },
      {
        "id": "poc.typescript.disabled-tls",
        "languages": ["typescript"],
        "severity": "HIGH",
        "message": "Keep peer certificate verification enabled.",
        "metadata":
          {
            "category": "security",
            "confidence": "HIGH",
            "cwe": ["CWE-295"],
            "owasp": ["A02:2025"],
          },
        "pattern-either":
          [{ "pattern": "({..., rejectUnauthorized: false, ...})" }],
      },
    ] }
