{
  "rules":
    [
      {
        "id": "poc.cpp.input-to-sql",
        "languages": ["cpp"],
        "mode": "taint",
        "severity": "HIGH",
        "message":
          "Untrusted input reaches SQL injection sensitive API (CWE-89). Use a
          constant statement and bound parameters.",
        "metadata":
          {
            "category": "security",
            "confidence": "HIGH",
            "cwe": ["CWE-89: SQL injection"],
            "owasp": ["A05:2025"],
          },
        "pattern-sources":
          [
            {
              "pattern-either":
                [
                  { "pattern": "getenv(...)" },
                  { "pattern": "std::getenv(...)" },
                  { "pattern": "argv[$INDEX]" },
                ],
            },
          ],
        "pattern-sinks":
          [
            {
              "patterns":
                [
                  {
                    "pattern-either":
                      [
                        { "pattern": "sqlite3_exec($DB, $INPUT, ...)" },
                        { "pattern": "sqlite3_prepare_v2($DB, $INPUT, ...)" },
                      ],
                  },
                  { "focus-metavariable": "$INPUT" },
                ],
            },
          ],
      },
      {
        "id": "poc.cpp.input-to-path",
        "languages": ["cpp"],
        "mode": "taint",
        "severity": "HIGH",
        "message":
          "Untrusted input reaches Path traversal sensitive API (CWE-22).
          Resolve a trusted identifier through an allowlist; do not open an
          arbitrary input path.",
        "metadata":
          {
            "category": "security",
            "confidence": "HIGH",
            "cwe": ["CWE-22: Path traversal"],
            "owasp": ["A01:2025"],
          },
        "pattern-sources":
          [
            {
              "pattern-either":
                [
                  { "pattern": "getenv(...)" },
                  { "pattern": "std::getenv(...)" },
                  { "pattern": "argv[$INDEX]" },
                ],
            },
          ],
        "pattern-sinks":
          [
            {
              "patterns":
                [
                  {
                    "pattern-either":
                      [
                        { "pattern": "fopen($INPUT, ...)" },
                        { "pattern": "std::fopen($INPUT, ...)" },
                      ],
                  },
                  { "focus-metavariable": "$INPUT" },
                ],
            },
          ],
      },
      {
        "id": "poc.cpp.input-to-ssrf",
        "languages": ["cpp"],
        "mode": "taint",
        "severity": "HIGH",
        "message":
          "Untrusted input reaches Server-side request forgery sensitive API
          (CWE-918). Allowlist destination schemes, hosts, and ports before
          issuing a request.",
        "metadata":
          {
            "category": "security",
            "confidence": "HIGH",
            "cwe": ["CWE-918: Server-side request forgery"],
            "owasp": ["A01:2025"],
          },
        "pattern-sources":
          [
            {
              "pattern-either":
                [
                  { "pattern": "getenv(...)" },
                  { "pattern": "std::getenv(...)" },
                  { "pattern": "argv[$INDEX]" },
                ],
            },
          ],
        "pattern-sinks":
          [
            {
              "patterns":
                [
                  {
                    "pattern-either":
                      [
                        {
                          "pattern":
                            "curl_easy_setopt($HANDLE, CURLOPT_URL, $INPUT)",
                        },
                      ],
                  },
                  { "focus-metavariable": "$INPUT" },
                ],
            },
          ],
      },
    ],
}
