version: "3"

tasks:
  default:
    desc: Restore pinned tools, dependencies, and Git hooks
    cmds:
      - task: :tools:install
      # Reload tool versions after installation before running the remaining tasks.
      - mise exec -- task deps setup:hooks

  hooks:
    desc: Install or refresh Git hooks
    cmds:
      - pnpm exec lefthook install

  ide:
    desc: Write build/compile_commands.json so clangd uses the C/C++ task flags
    cmds:
      - rm -f build/compile_commands.json
      - bash scripts/c-cpp.sh compdb c
      - bash scripts/c-cpp.sh compdb cpp
