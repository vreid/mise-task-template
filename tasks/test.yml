version: "3"

tasks:
  default:
    desc: Test all seven word-count examples
    cmds:
      - task: typescript
      - task: csharp
      - task: c
      - task: cpp
      - task: go
      - task: rust
      - task: python
      - task: tooling

  typescript:
    desc: Run the TypeScript tests with Node's test runner
    cmds:
      - node --test examples/typescript/test/*.test.ts

  csharp:
    desc: Run the C# test executable
    cmds:
      - dotnet run --project examples/csharp/tests/WordCount.Tests.csproj
        --no-restore

  c:
    desc: Run ASan and UBSan on the C example
    cmds:
      - bash scripts/c-cpp.sh test c

  cpp:
    desc: Run ASan and UBSan on the C++ example
    cmds:
      - bash scripts/c-cpp.sh test cpp

  go:
    desc: Run the Go tests without reusing cached test results
    dir: examples/go
    cmds:
      - go test -mod=readonly -count=1 ./...

  rust:
    desc: Run the Rust unit tests and doc tests
    dir: examples/rust
    cmds:
      - cargo test --locked

  python:
    desc: Run the Python doc tests
    cmds:
      - python -m doctest -v examples/python/word_count.py

  tooling:
    desc: Test required versus advisory Clang diagnostics with the real compiler
    cmds:
      - node --test scripts/clang-warnings.test.mts
