version: "3"

tasks:
  default:
    desc: Format all supported source, configuration, and documentation files
    cmds:
      - task: files
      - task: shell
      - task: python
      - task: go
      - task: rust
      - task: csharp

  files:
    desc: Format Oxfmt-supported files until formatting is stable
    silent: true
    summary: |
      Format the repository until no further formatting changes are needed.
      Fail if formatting does not stabilize within five passes.
    cmds:
      - bash scripts/fmt-files.sh

  shell:
    desc: Format repository shell scripts with shfmt
    cmds:
      - shfmt -w .

  python:
    desc: Format Python files, stubs, notebooks, and docstring code with Ruff
    cmds:
      - ruff format --config .ruff.toml .

  go:
    desc: Format Go files with gofumpt and goimports through golangci-lint
    cmds:
      - bash scripts/format-go.sh write

  rust:
    desc: Format all Rust targets with rustfmt
    dir: examples/rust
    cmds:
      - cargo fmt --all

  csharp:
    desc: Format C# whitespace in the application and test project
    cmds:
      - bash scripts/format-csharp.sh write
