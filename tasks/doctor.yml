version: "3"

tasks:
  default:
    desc: Show the selected tool versions
    summary: |
      After bootstrap, run mise exec -- task doctor.
      Checks that the tools execute without installing or repairing them.
    cmds:
      - task --version
      - node --version
      - pnpm --version
      - dotnet --version
      - go version
      - golangci-lint version
      - gopls version
      - rustc --version
      - cargo --version
      - cargo clippy --version
      - rustfmt --version
      - python --version
      - pnpm exec lefthook version
      - pnpm exec oxfmt --version
      - pnpm exec oxlint --version
      - pnpm exec commitlint --version
      # Print markdownlint's version banner without selecting files to lint.
      - pnpm exec markdownlint-cli2 --no-globs
      - shellcheck --version
      - shfmt --version
      - actionlint --version
      - pnpm exec actions-up --version
      - ruff --version
      - uv --version
      - scc --version
      - lizard --version
      - betterleaks version
      - syft version
      - cmd: grant version
        platforms: [linux, darwin]
      - cmd:
          echo 'Grant unavailable on native Windows; license policy runs on
          Linux and macOS.'
        platforms: [windows]
      - grype version
      - opengrep --version
      - clang --version
      - clang++ --version
      - llvm-config --version
      - clang-tidy --version
      - clang-format --version
      - llvm-symbolizer --version
