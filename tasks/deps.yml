version: "3"

tasks:
  default:
    desc: Restore dependencies from pnpm-lock.yaml
    cmds:
      - pnpm install --frozen-lockfile

  update:
    desc: Update all workspace dependency ranges and the lockfile to latest
    summary: |
      Update dependencies, devDependencies, optionalDependencies, and peerDependencies,
      including major upgrades, in the root project and every workspace package.
      Keep Node and pnpm major versions in devEngines unchanged.
      Transitive packages resolve within their parents' declared ranges.
    cmds:
      - pnpm update --recursive --include-workspace-root --latest --peer
