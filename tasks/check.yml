version: "3"

tasks:
  default:
    desc:
      Run analysis and security checks; report formatting and license findings
    summary: |
      Check all supported repository files without changing them.
      Lint, type checks, SAST, suppressions without a rule or reason, secrets, High/Critical vulnerabilities without a recorded acceptance, and tool errors fail.
      Formatting, license policy findings, and C/C++ compiler warnings are advisory.
      SBOMs, complexity metrics, and the suppression register are written to reports/.
      Use task verify to enforce formatting or task fix to apply it.
    cmds:
      # Runs last, even when a check fails, so failed runs keep their findings.
      - defer: { task: findings }
      - task: manifest
      - task: fmt
      - task: lint
      - task: metrics
      - task: shell
      - task: docs
      - task: actions
      - task: sast
      # Generate reports before the secret scan so exported files are covered.
      - task: suppressions
      - task: sbom
      - task: secrets
      - task: licenses
      - task: vulnerabilities

  fmt:
    desc:
      Report formatting differences; fail on formatter or configuration errors
    silent: true
    cmds:
      - bash scripts/check-fmt.sh
      - bash scripts/check-fmt-shell.sh
      - bash scripts/check-fmt-python.sh
      - bash scripts/format-go.sh check
      - bash scripts/check-fmt-rust.sh
      - bash scripts/format-csharp.sh check
      - bash scripts/format-c-cpp.sh check

  lint:
    desc: Run all configured language linters and type checks
    cmds:
      - task: typescript
      - task: go
      - task: rust
      - task: csharp
      - task: python
      - task: c
      - task: cpp

  metrics:
    desc: Report repository size and require maintainable code complexity
    cmds:
      - task: scc
      - task: lizard

  scc:
    desc: Report file sizes and estimated complexity, highest first per language
    cmds:
      - mkdir -p reports
      - scc --no-config --no-cocomo --no-size --by-file --wide --sort complexity
        --ci --format-multi "wide:stdout,json:reports/sloc.json" .

  sloc-diff:
    desc:
      Compare code lines per language with BASE (default origin/main); write
      reports/sloc-diff.md
    vars:
      BASE: '{{.BASE | default "origin/main"}}'
    env:
      SLOC_BASE: "{{.BASE}}"
    cmds:
      - node scripts/sloc-diff.mts "$SLOC_BASE"

  lizard:
    desc: Require strict function complexity, size, and parameter limits
    cmds:
      - bash scripts/check-complexity.sh

  typescript:
    desc: Run strict Oxlint and TypeScript checks across the repository
    cmds:
      - pnpm exec oxlint .

  go:
    desc: Run strict golangci-lint checks, including Go tests
    dir: examples/go
    cmds:
      - golangci-lint config verify --config ../../.golangci.yml
      - golangci-lint run --config ../../.golangci.yml ./...

  rust:
    desc: Run Clippy on all Rust targets and features with warnings as errors
    dir: examples/rust
    cmds:
      - cargo clippy --locked --all-targets --all-features -- -D warnings

  csharp:
    desc: Run the C# compiler and all configured SDK analyzers on both projects
    cmds:
      - dotnet build examples/csharp/tests/WordCount.Tests.csproj --no-restore
        --no-incremental

  shell:
    desc: Check repository shell scripts with ShellCheck
    cmds:
      - bash scripts/shellcheck.sh

  python:
    desc: Check Python files, stubs, and notebooks with strict Ruff rules
    cmds:
      - ruff check --config .ruff.toml .

  docs:
    desc: Check Markdown structure and content with markdownlint
    cmds:
      - pnpm exec markdownlint-cli2

  actions:
    desc: Check GitHub Actions workflows and their embedded shell scripts
    cmds:
      - actionlint

  actions:updates:
    desc: Report available GitHub Actions updates without changing files
    cmds:
      - pnpm exec actions-up --dry-run

  secrets:
    desc: Scan the working tree for secrets with Betterleaks
    # Inline allow comments carry no rule or reason; accept findings by
    # fingerprint with a reason in .betterleaksignore instead. The explicit
    # config keeps a dropped-in .gitleaks.toml from reconfiguring the scan.
    cmds:
      - mkdir -p reports
      - betterleaks dir . --config security/betterleaks.toml --redact=100
        --validation=false --no-banner --ignore-gitleaks-allow --report-format
        json --report-path reports/secrets.json

  sast:
    desc: Test the Opengrep rules and reject matching source vulnerabilities
    cmds:
      - task: :test:sast
      - bash scripts/check-sast.sh

  secrets:history:
    desc:
      Scan Git history for secrets (HISTORY=git log range, default HEAD; --all
      for every local ref)
    vars:
      HISTORY: '{{.HISTORY | default "HEAD"}}'
    env:
      HISTORY_RANGE: "{{.HISTORY}}"
    preconditions:
      - sh: test "$(git rev-parse --is-shallow-repository)" = false
        msg:
          A shallow clone hides older commits. Run git fetch --unshallow, or
          check out with fetch-depth 0.
    cmds:
      - mkdir -p reports
      - betterleaks git . --log-opts="$HISTORY_RANGE" --config
        security/betterleaks.toml --redact=100 --validation=false --no-banner
        --ignore-gitleaks-allow --report-format json --report-path
        reports/secrets-history.json

  manifest:
    desc: Record the analyzed commit and platform in reports/manifest.json
    cmds:
      - bash scripts/report-manifest.sh

  findings:
    desc: Classify all reported findings as high, medium, or low
    cmds:
      - node scripts/findings.mts

  suppressions:
    desc:
      Require a specific rule and a reason for each inline suppression; record
      them in reports/suppressions.json
    cmds:
      - node scripts/suppressions.mts

  sbom:
    desc: Inventory the repository with Syft and write SBOMs to reports/
    # licenses and vulnerabilities both consume this inventory.
    run: once
    cmds:
      - bash scripts/sbom.sh

  licenses:
    desc: Warn about OSI policy findings in the repository SBOM
    cmds:
      - task: sbom
      - cmd: bash scripts/check-licenses.sh
        platforms: [linux, darwin]
      - cmd:
          echo 'License check unavailable on native Windows (Grant has no
          release); Linux and macOS run the policy.'
        platforms: [windows]

  vulnerabilities:
    desc:
      Scan the repository SBOM with Grype; fail on High/Critical findings that
      are not accepted with a reason
    cmds:
      - task: sbom
      - bash scripts/check-vulnerabilities.sh

  audit:
    desc: Audit npm dependencies for High/Critical vulnerabilities on demand
    summary: |
      Run pnpm audit with dependency paths and patched versions.
      This optional diagnostic is not included in check, verify, or maintenance.
      Findings can return nonzero even when no fix is published.
    cmds:
      - pnpm audit --audit-level high

  commit:
    desc: Validate a Conventional Commit message (MESSAGE_FILE=path)
    requires:
      vars: [MESSAGE_FILE]
    env:
      COMMIT_MESSAGE_FILE: "{{.MESSAGE_FILE}}"
    cmds:
      - pnpm exec commitlint --edit "$COMMIT_MESSAGE_FILE"

  c:
    desc: Analyze C sources and tests; compiler warnings are advisory
    cmds:
      - bash scripts/c-cpp.sh check c

  cpp:
    desc: Analyze C++ sources and tests; compiler warnings are advisory
    cmds:
      - bash scripts/c-cpp.sh check cpp
