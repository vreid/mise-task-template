version: "3"

tasks:
  default:
    desc:
      Run analysis and security checks; report formatting and license findings
    summary: |
      Check all supported repository files without changing them.
      Lint, type checks, secrets, fixable High/Critical vulnerabilities, and tool errors fail.
      Formatting, license policy findings, and C/C++ compiler warnings are advisory.
      Use task verify to enforce formatting or task fix to apply it.
    cmds:
      - task: fmt
      - task: lint
      - task: metrics
      - task: shell
      - task: docs
      - task: secrets
      - task: licenses
      - task: vulnerabilities

  fmt:
    desc:
      Report formatting differences; fail on formatter or configuration errors
    silent: true
    cmds:
      - bash scripts/check-fmt.sh
      - bash scripts/check-fmt-shell.sh
      - bash scripts/check-fmt-python.sh
      - bash scripts/format-go.sh check
      - bash scripts/check-fmt-rust.sh
      - bash scripts/format-csharp.sh check
      - bash scripts/format-c-cpp.sh check

  lint:
    desc: Run all configured language linters and type checks
    cmds:
      - task: typescript
      - task: go
      - task: rust
      - task: csharp
      - task: python
      - task: c
      - task: cpp

  metrics:
    desc: Report repository size and require maintainable code complexity
    cmds:
      - task: scc
      - task: lizard

  scc:
    desc: Report file sizes and estimated complexity, highest first per language
    cmds:
      - scc --no-config --no-cocomo --no-size --by-file --wide --sort complexity
        --ci .

  lizard:
    desc: Require strict function complexity, size, and parameter limits
    cmds:
      - bash scripts/check-complexity.sh

  typescript:
    desc: Run strict Oxlint and TypeScript checks across the repository
    cmds:
      - pnpm exec oxlint .

  go:
    desc: Run strict golangci-lint checks, including Go tests
    dir: examples/go
    cmds:
      - golangci-lint config verify --config ../../.golangci.yml
      - golangci-lint run --config ../../.golangci.yml ./...

  rust:
    desc: Run Clippy on all Rust targets and features with warnings as errors
    dir: examples/rust
    cmds:
      - cargo clippy --locked --all-targets --all-features -- -D warnings

  csharp:
    desc: Run the C# compiler and all configured SDK analyzers on both projects
    cmds:
      - dotnet build examples/csharp/tests/WordCount.Tests.csproj --no-restore
        --no-incremental

  shell:
    desc: Check repository shell scripts with ShellCheck
    cmds:
      - bash scripts/shellcheck.sh

  python:
    desc: Check Python files, stubs, and notebooks with strict Ruff rules
    cmds:
      - ruff check --config .ruff.toml .

  docs:
    desc: Check Markdown structure and content with markdownlint
    cmds:
      - pnpm exec markdownlint-cli2

  secrets:
    desc: Scan the working tree for secrets with Betterleaks
    cmds:
      - betterleaks dir . --redact=100 --validation=false --no-banner

  secrets:history:
    desc: Scan all locally available Git history for secrets
    cmds:
      - betterleaks git . --log-opts=--all --redact=100 --validation=false
        --no-banner

  licenses:
    desc: Inventory the repository with Syft and warn about OSI policy findings
    cmds:
      - bash scripts/check-licenses.sh

  vulnerabilities:
    desc: Scan with Grype; fail on High/Critical findings with available fixes
    cmds:
      - bash scripts/check-vulnerabilities.sh

  audit:
    desc: Audit npm dependencies for High/Critical vulnerabilities on demand
    summary: |
      Run pnpm audit with dependency paths and patched versions.
      This optional diagnostic is not included in check, verify, or maintenance.
      Findings can return nonzero even when no fix is published.
    cmds:
      - pnpm audit --audit-level high

  commit:
    desc: Validate a Conventional Commit message (MESSAGE_FILE=path)
    requires:
      vars: [MESSAGE_FILE]
    env:
      COMMIT_MESSAGE_FILE: "{{.MESSAGE_FILE}}"
    cmds:
      - pnpm exec commitlint --edit "$COMMIT_MESSAGE_FILE"

  c:
    desc: Analyze C sources and tests; compiler warnings are advisory
    cmds:
      - bash scripts/c-cpp.sh check c

  cpp:
    desc: Analyze C++ sources and tests; compiler warnings are advisory
    cmds:
      - bash scripts/c-cpp.sh check cpp
