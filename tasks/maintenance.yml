version: "3"

tasks:
  default:
    desc:
      Update tools, dependencies, and license policy, apply fixes, and verify
    summary: |
      Update mise tools within their declared version ranges and all workspace dependencies to latest.
      Include dependency major upgrades while preserving the Node and pnpm major versions.
      Refresh exact .NET and Rust runtime pins within their selected major versions.
      Refresh the OSI-approved license list from SPDX.
      Restore tools, dependencies, and Git hooks, then run doctor, fix, and verify.
      Review formatting, native version files, manifests, lockfiles, and .grant.yaml before committing.
    cmds:
      - task: runtimes
      - task: :tools:update
      # Reload tool versions after updating before running the remaining tasks.
      - mise exec -- task maintenance:deps maintenance:licenses setup doctor fix
        verify

  runtimes:
    desc: Refresh native .NET and Rust version pins through mise
    summary: |
      Update global.json and rust-toolchain.toml to the latest releases within their selected majors.
      Run task tools:update afterward to refresh mise.lock and install the new versions.
      The full maintenance task performs both steps in order.
    cmds:
      - node scripts/update-runtime-versions.mts

  deps:
    desc: Update all package.json dependency versions, including major upgrades
    cmds:
      - task: :deps:update

  licenses:
    desc:
      Refresh the allowed OSI-approved license IDs from the SPDX License List
    cmds:
      - node scripts/update-license-policy.mts

  clang-warnings:
    desc: Explicitly adopt every warning ID known to the installed Clang
    summary: |
      Refresh .clang-warnings.json after reviewing a compiler upgrade.
      This changes the required warning policy; normal maintenance does not run it.
      Review the diff and run task verify before committing.
    cmds:
      - node scripts/update-clang-warnings.mts
