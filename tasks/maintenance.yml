version: "3"

tasks:
  default:
    desc:
      Update tools, dependencies, and license policy, apply fixes, and verify
    summary: |
      Update mise tools within their declared version ranges and all workspace dependencies to latest.
      Include dependency major upgrades while preserving the Node and pnpm major versions.
      Refresh the OSI-approved license list from SPDX.
      Restore tools, dependencies, and Git hooks, then run doctor, fix, and verify.
      Review formatting, package.json, both lockfiles, and .grant.yaml before committing.
    cmds:
      - task: :tools:update
      # Reload tool versions after updating before running the remaining tasks.
      - mise exec -- task maintenance:deps maintenance:licenses setup doctor fix
        verify

  deps:
    desc: Update all package.json dependency versions, including major upgrades
    cmds:
      - task: :deps:update

  licenses:
    desc:
      Refresh the allowed OSI-approved license IDs from the SPDX License List
    cmds:
      - node scripts/update-license-policy.mts
