version: "3"

tasks:
  default:
    desc: Build, check, and test all examples, including strict formatting
    cmds:
      - task: :build
      - task: :check:lint
      - task: :check:shell
      - task: :check:python
      - task: :check:docs
      - task: :check:secrets
      - task: :check:licenses
      - task: :check:vulnerabilities
      - task: fmt
      - task: :test

  fmt:
    desc: Require consistent formatting across all supported files
    cmds:
      - pnpm exec oxfmt --check .
      - shfmt -d .
      - ruff format --config .ruff.toml --check .
