version: "3"

tasks:
  default:
    desc: Restore dependencies, build, check, and test with strict formatting
    cmds:
      - task: :deps
      - task: :build
      - task: lint
      - task: :check:metrics
      - task: :check:shell
      - task: :check:docs
      - task: :check:actions
      - task: :check:sast
      # Generate reports before the secret scan so exported files are covered.
      - task: :check:sbom
      - task: :check:secrets
      # Commits being verified must not add secrets, even ones deleted later.
      - task: :check:secrets:history
      - task: :check:licenses
      - task: :check:vulnerabilities
      - task: fmt
      - task: :test

  fmt:
    desc: Require consistent formatting across all supported files
    cmds:
      - pnpm exec oxfmt --check .
      - shfmt -d .
      - ruff format --config .ruff.toml --check .
      - bash scripts/format-go.sh verify
      - cargo fmt --manifest-path examples/rust/Cargo.toml --all -- --check
      - bash scripts/format-csharp.sh verify
      - bash scripts/format-c-cpp.sh verify

  lint:
    desc: Require all language checks, including the frozen Clang warning policy
    cmds:
      - task: :check:typescript
      - task: :check:go
      - task: :check:rust
      - task: :check:csharp
      - task: :check:python
      - task: c
      - task: cpp

  c:
    desc: Require adopted Clang diagnostics and clang-tidy checks for C
    cmds:
      - bash scripts/c-cpp.sh verify c

  cpp:
    desc: Require adopted Clang diagnostics and clang-tidy checks for C++
    cmds:
      - bash scripts/c-cpp.sh verify cpp
