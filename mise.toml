# Bootstrap: mise trust && mise install --locked && mise exec -- task setup
# Run tasks: mise exec -- task
min_version = "2026.10.0"

[settings]
# Keep project tools ahead of system installations on PATH.
activate_aggressive = true
# Task uses Taskfile.yml; Node and pnpm use package.json.
idiomatic_version_file_enable_tools = ["task", "node", "pnpm"]
lockfile = true

[tools]
betterleaks = "latest"
grype = "latest"
shellcheck = "latest"
shfmt = "latest"
syft = "latest"
"github:anchore/grant" = "latest"

# Use the complete upstream LLVM distribution, including Clang and Clang++.
# Exact versions are recorded in mise.lock.
"github:llvm/llvm-project" = { version = "latest", matching = ".tar.zst" }
