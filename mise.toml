# Bootstrap: mise trust && mise install --locked
# Run tasks: mise exec -- task
min_version = "2026.10.0"

[settings]
# Task reads its version from Taskfile.yml. LLVM has no idiomatic version file.
idiomatic_version_file_enable_tools = ["task"]
lockfile = true

[tools]
# Use the complete upstream LLVM distribution, including Clang and Clang++.
# Exact versions are recorded in mise.lock.
"github:llvm/llvm-project" = { version = "latest", matching = ".tar.zst" }
