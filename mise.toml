# Bootstrap: mise trust && mise install --locked && mise exec -- task setup
# Run tasks: mise exec -- task
min_version = "2026.10.0"

[settings]
# Keep project tools ahead of system installations on PATH.
activate_aggressive = true
# Runtime versions come from the native version files at the project root.
idiomatic_version_file_enable_tools = [
  "task",
  "node",
  "pnpm",
  "dotnet",
  "go",
  "golangci-lint",
  "rust",
  "python",
]
# go.mod declares compatibility; .go-version selects the development compiler.
idiomatic_version_file_disable_files = ["go:go.mod"]
lockfile = true

[tools]
betterleaks = "latest"
grype = "latest"
opengrep = "latest"
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
syft = "latest"
uv = "latest"
"github:anchore/grant" = "latest"
"github:boyter/scc" = "latest"
# Isolated CLI environment; mise locks Lizard and its Python dependencies.
"pypi:lizard" = "latest"

# Use the complete upstream LLVM distribution, including Clang and Clang++.
# Exact versions are recorded in mise.lock.
"github:llvm/llvm-project" = { version = "latest", matching = ".tar.zst" }
