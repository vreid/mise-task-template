check-for-app-update: false

# Fail on every High/Critical finding, whether or not a fix exists. Accept one
# only below, with a reason; lower severities stay visible without failing.
fail-on-severity: high
show-suppressed: true

ignore:
  # Accepted while no fixed release exists. The rule stops applying once braces
  # publishes a fix; the gate then fails until the dependency is updated.
  - vulnerability: GHSA-vfj7-8cjw-p6xm
    fix-state: not-fixed
    package:
      name: braces
      version: 3.0.3
      type: npm
    reason: >-
      Stack exhaustion needs attacker-controlled glob patterns. braces arrives
      only through markdownlint-cli2, which gets its patterns from repository
      configuration, so the worst case is a failed lint run. Reviewed
      2026-10-04.

  # Revisit when TypeScript publishes a rebuilt compiler. This rule stops matching
  # when the compiler version, embedded module version, or advisory changes.
  - vulnerability: GO-2026-5970
    package:
      name: golang.org/x/text
      version: v0.38.0
      type: go-module
      location: /node_modules/.pnpm/@typescript+typescript-*@7.0.2/node_modules/@typescript/typescript-*/lib/tsc*
    reason: >-
      Embedded in TypeScript 7.0.2, the latest stable release checked
      2026-10-04. pnpm cannot replace a Go module compiled into this binary;
      awaiting a TypeScript release containing the fix. Review during
      maintenance.

  # Windows only: Syft records no Go function symbols for PE binaries, so Grype
  # matches every standard library advisory at module granularity. Linux and
  # macOS match the same TypeScript 7.0.2 compiler (go1.26.4) by function and
  # report none of these High advisories; none of them is Windows-specific.
  - vulnerability: GO-2026-4970
    package: &windows-tsc
      name: stdlib
      version: go1.26.4
      type: go-module
      location: /node_modules/.pnpm/@typescript+typescript-win32-*@7.0.2/node_modules/@typescript/typescript-win32-*/lib/tsc.exe
    reason: &windows-tsc-reason >-
      Windows build of TypeScript 7.0.2's compiler, which has no symbols for
      function-level matching. Linux and macOS clear this advisory for the same
      release by function. Remove after upgrading TypeScript.
  - vulnerability: GO-2026-5026
    package: *windows-tsc
    reason: *windows-tsc-reason
  - vulnerability: GO-2026-5942
    package: *windows-tsc
    reason: *windows-tsc-reason
  - vulnerability: GO-2026-5972
    package: *windows-tsc
    reason: *windows-tsc-reason
  - vulnerability: GO-2026-6088
    package: *windows-tsc
    reason: *windows-tsc-reason
  - vulnerability: GO-2026-6089
    package: *windows-tsc
    reason: *windows-tsc-reason
  - vulnerability: GO-2026-6090
    package: *windows-tsc
    reason: *windows-tsc-reason

# Keep the summary table and show the files/binaries behind each finding.
output: [table, template]
output-template-file: templates/grype-locations.tmpl
