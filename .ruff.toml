line-length = 80
indent-width = 4
extend-include = ["*.pyw"]
# Deliberately weak code; scripts/linter-fixtures.test.mts lints it explicitly.
extend-exclude = [
  "build",
  "coverage",
  "security/linter-tests",
  "security/tests/python/data-injection.py",
]

[lint]
# Enable all stable rules. mise.lock makes rule changes reviewable on updates.
select = ["ALL"]
ignore = [
  # Standalone scripts do not need to be Python packages.
  "INP001",
  # Ruff's formatter owns layout, quotes, and line wrapping.
  "COM812",
  "COM819",
  "D203",
  "D206",
  "D300",
  "E111",
  "E114",
  "E117",
  "E501",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "Q004",
  "W191",
]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# Deliberately unsafe subprocess examples and native ruleid/ok test comments.
"security/tests/python/command-injection.py" = [
  "ERA001",
  "S602",
  "S603",
  "S605",
]

[format]
# Oxfmt owns Markdown; Ruff formats Python code and Python docstrings.
exclude = ["*.md"]
docstring-code-format = true
line-ending = "lf"
